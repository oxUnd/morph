# /etc/nginx/sites-available/morph
#
# Front-ends a `morph-fastcgi` process listening on TCP 9000 and serves
# the static SPA from /var/www/morph.  Note the dedicated
# `/api/sessions/.../events` location block: SSE responses must NOT be
# buffered or the client never sees a token until the whole turn finishes.

upstream morph_fastcgi {
    server 127.0.0.1:9000;
}

server {
    listen      80;
    server_name _;

    root  /var/www/morph;
    index index.html;

    # ---- normal JSON endpoints ----
    location /api/ {
        include /etc/nginx/fastcgi_params;
        fastcgi_pass    morph_fastcgi;
        fastcgi_param   QUERY_STRING     $query_string;
        fastcgi_param   REQUEST_METHOD   $request_method;
        fastcgi_param   CONTENT_TYPE     $content_type;
        fastcgi_param   CONTENT_LENGTH   $content_length;
        fastcgi_param   DOCUMENT_URI     $document_uri;
        fastcgi_param   REQUEST_URI      $request_uri;
        fastcgi_param   HTTPS            $https if_not_empty;
        fastcgi_param   HTTP_AUTHORIZATION $http_authorization;
    }

    # ---- SSE endpoint: streaming, no buffering ----
    location ~ ^/api/sessions/[^/]+/events$ {
        include /etc/nginx/fastcgi_params;
        fastcgi_pass             morph_fastcgi;
        fastcgi_buffering        off;
        fastcgi_read_timeout     1h;
        fastcgi_send_timeout     1h;
        proxy_buffering          off;
        gzip                     off;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
        fastcgi_param   HTTP_AUTHORIZATION $http_authorization;
    }

    # ---- static SPA ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
