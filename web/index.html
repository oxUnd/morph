<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Morph</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,Helvetica,sans-serif;color:#222;background:#fff;height:100dvh}

/* ---- auth cards ---- */
#auth{display:flex;align-items:center;justify-content:center;height:100dvh}
#auth .card{max-width:320px;width:100%;padding:2rem}
#auth h2{font-size:1.1rem;font-weight:600;margin-bottom:1.2rem;text-align:center}
#auth input{display:block;width:100%;font:inherit;font-size:.875rem;padding:.4rem .6rem;border:1px solid #e0e0e0;border-radius:4px;margin-bottom:.6rem;color:#222;background:#fff}
#auth input:focus{outline:none;border-color:#2563eb}
#auth button{display:block;width:100%;font:inherit;font-size:.875rem;padding:.45rem;border:1px solid #e0e0e0;border-radius:4px;background:#fff;cursor:pointer;color:#222;margin-top:.3rem}
#auth button:hover{border-color:#2563eb;color:#2563eb}
#auth .link{text-align:center;font-size:.8rem;color:#888;margin-top:.8rem}
#auth .link a{color:#2563eb;cursor:pointer;text-decoration:none}
#auth .link a:hover{text-decoration:underline}
#auth .err{color:#d53d3d;font-size:.8rem;margin-top:.5rem;text-align:center;min-height:1.2em}

/* ---- chat app ---- */
#app{display:none;flex-direction:column;height:100dvh}
#topbar{display:flex;align-items:center;gap:.6rem;padding:.45rem 1rem;border-bottom:1px solid #e0e0e0;font-size:.875rem;flex-shrink:0}
#topbar select{font:inherit;font-size:.875rem;padding:.2rem .4rem;border:1px solid #e0e0e0;border-radius:4px;background:#fff;color:#222;cursor:pointer;max-width:220px;min-width:140px}
#topbar select:focus{outline:none;border-color:#2563eb}
#topbar .spacer{margin-left:auto}
#topbar .user{font-size:.8rem;color:#888}
#topbar .logout{font:inherit;font-size:.75rem;padding:.15rem .4rem;border:1px solid #e0e0e0;border-radius:3px;background:#fff;cursor:pointer;color:#888}
#topbar .logout:hover{color:#d53d3d;border-color:#d53d3d}
#topbar .del-sess{font:inherit;font-size:.75rem;padding:.15rem .4rem;border:1px solid #e0e0e0;border-radius:3px;background:#fff;cursor:pointer;color:#888}
#topbar .del-sess:hover{color:#d53d3d;border-color:#d53d3d}
#topbar #newSess{font:inherit;font-size:.75rem;padding:.25rem .6rem;border:1px solid #e0e0e0;border-radius:4px;background:#fff;cursor:pointer;color:#222}
#topbar #newSess:hover{border-color:#2563eb;color:#2563eb}
#status{font-size:.75rem;color:#888;display:flex;align-items:center;gap:3px}
#status.on{color:#16a34a}
#status .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#ccc;flex-shrink:0}
#status.on .dot{background:#16a34a}
#chat{flex:1;overflow-y:auto;padding:1rem 1.5rem;display:flex;flex-direction:column;gap:.6rem}
#chat:empty::after{content:'Select or create a session to start';display:block;color:#ccc;text-align:center;margin-top:4rem;font-size:.9rem;font-style:italic}
.msg-user{display:flex;justify-content:flex-end}
.msg-user .b{background:#2563eb;color:#fff;padding:.45rem .85rem;border-radius:14px 14px 4px 14px;max-width:70%;word-break:break-word;font-size:.9rem;line-height:1.45}
.msg-assistant{padding:.1rem 0}
.msg-assistant .c{line-height:1.65;font-size:.925rem;max-width:85%}
.msg-assistant .c p{margin:.5em 0}
.msg-assistant .c p:first-child{margin-top:.15em}
.msg-assistant .c pre{background:#f5f5f5;padding:.6rem;border-radius:6px;overflow-x:auto;font-size:.82rem;margin:.5em 0}
.msg-assistant .c code{font-size:.85em;background:#f0f0f0;padding:.1em .3em;border-radius:3px;word-break:break-word}
.msg-assistant .c pre code{background:none;padding:0}
.msg-assistant .c ul,.msg-assistant .c ol{padding-left:1.5rem;margin:.4em 0}
.msg-assistant .c blockquote{border-left:3px solid #e0e0e0;padding-left:.75rem;color:#666;margin:.5em 0}
.msg-assistant .c table{border-collapse:collapse;margin:.5em 0;font-size:.85rem}
.msg-assistant .c th,.msg-assistant .c td{border:1px solid #e0e0e0;padding:.25rem .5rem;text-align:left}
.msg-assistant .c th{background:#f5f5f5}
.msg-assistant .c img{max-width:100%;border-radius:6px;margin:.4em 0}
.msg-assistant .c video{max-width:100%;border-radius:6px;margin:.4em 0}
.msg-assistant .copy{font-size:.72rem;color:#ccc;cursor:pointer;border:none;background:none;padding:.1rem .3rem;border-radius:3px;float:right;margin-top:.2rem;opacity:0;transition:opacity .12s}
.msg-assistant:hover .copy{opacity:1}
.msg-assistant .copy:hover{color:#2563eb;background:#f0f4ff}
.msg-thought{border-left:3px solid #5b8def;padding:.3rem .7rem;margin:.15rem 0;font-size:.85rem;color:#666;font-style:italic}
.msg-thought .label{font-style:normal;font-weight:500;color:#5b8def;font-size:.78rem;margin-bottom:.1rem;display:flex;align-items:center;gap:4px}
.msg-thought .label .indicator{width:4px;height:4px;border-radius:50%;background:#5b8def;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.msg-thought .bd{overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;line-height:1.5}
.msg-thought.expanded .bd{display:block;-webkit-line-clamp:unset}
.msg-thought .toggle{font-style:normal;font-size:.75rem;color:#999;cursor:pointer;border:none;background:none;padding:0;margin-top:.05rem;display:none}
.msg-thought .toggle.show{display:inline}
.msg-thought .toggle:hover{color:#5b8def}
.msg-thought.truncated .toggle.show{display:inline}
.msg-tool{border-left:3px solid #e08e3c;padding:.3rem .7rem;margin:.15rem 0;font-size:.85rem}
.msg-tool .hd{display:flex;align-items:center;gap:.35rem;cursor:pointer;user-select:none}
.msg-tool .hd .arrow{font-size:.65rem;color:#aaa;transition:transform .12s;display:inline-block}
.msg-tool.expanded .hd .arrow{transform:rotate(90deg)}
.msg-tool .hd .name{font-weight:500;color:#e08e3c}
.msg-tool .hd .args-preview{color:#888;font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:300px}
.msg-tool .bd{display:none;margin-top:.35rem}
.msg-tool.expanded .bd{display:block}
.msg-tool .bd pre{background:#f5f5f5;padding:.5rem;border-radius:4px;overflow-x:auto;font-size:.8rem;margin:.2rem 0;white-space:pre-wrap;word-break:break-word}
.msg-tool .bd .result-label{font-size:.75rem;color:#888;margin-top:.3rem;font-weight:500}
.msg-reflection{border-left:3px solid #d4a017;padding:.3rem .7rem;margin:.15rem 0;font-size:.85rem;color:#8a6e00;background:#fffcf0}
.msg-reflection .label{font-weight:500;font-size:.78rem}
.msg-error{border-left:3px solid #d53d3d;padding:.3rem .7rem;margin:.15rem 0;font-size:.85rem;color:#b91c1c;background:#fff5f5}
.msg-artifact{border-left:3px solid #16a34a;padding:.3rem .7rem;margin:.15rem 0;font-size:.85rem}
.msg-artifact .label{font-weight:500;color:#16a34a;font-size:.78rem;margin-bottom:.2rem}
.msg-artifact img{max-width:100%;border-radius:4px}
.msg-artifact video{max-width:100%;border-radius:4px}
.msg-artifact a{color:#2563eb;font-size:.8rem}
.turn-hr{border:none;border-top:1px solid #eee;margin:.35rem 0}
#inputbar{display:flex;align-items:flex-end;gap:.5rem;padding:.55rem 1rem;border-top:1px solid #e0e0e0;flex-shrink:0}
#prompt{flex:1;font:inherit;font-size:.9rem;padding:.45rem .75rem;border:1px solid #e0e0e0;border-radius:8px;resize:none;outline:none;line-height:1.4;max-height:200px;min-height:40px}
#prompt:focus{border-color:#2563eb}
#prompt:disabled{background:#f9f9f9;color:#888}
#send{font:inherit;font-size:.875rem;padding:.45rem 1.2rem;border:1px solid #e0e0e0;border-radius:8px;background:#fff;cursor:pointer;color:#222;white-space:nowrap}
#send:hover:not(:disabled){border-color:#2563eb;color:#2563eb}
#send:disabled{opacity:.4;cursor:default}
#inputbar .hint{font-size:.7rem;color:#ccc;margin-bottom:.15rem}
@media(max-width:600px){
  #chat{padding:.75rem .75rem}
  .msg-user .b{max-width:85%}
  #topbar select{max-width:140px;min-width:100px}
}
</style>
</head>
<body>

<div id="auth">
  <div class="card" id="authCard"></div>
</div>

<div id="app">
  <div id="topbar">
    <select id="sessionSelect"><option value="">— Session —</option></select>
    <button class="del-sess" id="delSess" title="Delete session">Delete</button>
    <span id="status"><span class="dot"></span></span>
    <button id="newSess">+ New</button>
    <span class="spacer"></span>
    <span class="user" id="userLabel"></span>
    <button class="logout" id="logoutBtn">Logout</button>
  </div>
  <div id="chat"></div>
  <div id="inputbar">
    <textarea id="prompt" rows="1" placeholder="Ask Morph anything…"></textarea>
    <button id="send">Send</button>
  </div>
</div>

<script>
var sid = null, thoughtEl = null, turnCount = 0, sessions = [], isBusy = false;
var sseCtrl = null;
var markedOk = typeof marked !== 'undefined' && typeof marked.parse === 'function';
var purifyOk = typeof DOMPurify !== 'undefined';

var chat = document.getElementById('chat');
var sel  = document.getElementById('sessionSelect');
var inp  = document.getElementById('prompt');
var btn  = document.getElementById('send');
var st   = document.getElementById('status');
var authCard = document.getElementById('authCard');
var authDiv = document.getElementById('auth');
var appDiv  = document.getElementById('app');

/* ---- credentials ---- */
function token() { return localStorage.getItem('morph_token') || ''; }
function username() { return localStorage.getItem('morph_username') || ''; }
function saveToken(tok, user) {
  localStorage.setItem('morph_token', tok);
  localStorage.setItem('morph_username', user);
}
function clearCreds() {
  localStorage.removeItem('morph_token');
  localStorage.removeItem('morph_username');
}

/* ---- auth header ---- */
function authHdr() {
  var t = token();
  return t ? { 'Authorization': 'Bearer ' + t } : {};
}

/* ---- api helper ---- */
async function api(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign({ 'Content-Type': 'application/json' }, authHdr(), opts.headers || {});
  var r = await fetch(path, opts);
  if (r.status === 401) { clearCreds(); throw Object.assign(new Error('Unauthorized'), { status: 401 }); }
  if (r.status === 429) throw Object.assign(new Error('Too Many Requests'), { status: 429 });
  if (!r.ok) { var t = await r.text().catch(function(){}); throw Object.assign(new Error('HTTP ' + r.status + (t ? ': ' + t : '')), { status: r.status }); }
  if (r.status === 204) return null;
  return r.json();
}

/* ---- view switching ---- */
function showAuth(mode, err) {
  appDiv.style.display = 'none';
  authDiv.style.display = 'flex';
  disconnect();
  var h = '';
  if (mode === 'install') {
    h = '<h2>Initialize Morph</h2>'
      + '<input id="aUser" type="text" placeholder="Username" autocomplete="username" />'
      + '<input id="aPass" type="password" placeholder="Password" autocomplete="new-password" />'
      + '<button id="aSubmit">Create Admin</button>'
      + '<div class="err" id="aErr">' + (err || '') + '</div>';
  } else if (mode === 'signup') {
    h = '<h2>Sign Up</h2>'
      + '<input id="aUser" type="text" placeholder="Username" autocomplete="username" />'
      + '<input id="aPass" type="password" placeholder="Password" autocomplete="new-password" />'
      + '<input id="aCode" type="text" placeholder="Invite code (optional)" />'
      + '<button id="aSubmit">Sign Up</button>'
      + '<div class="link">Already have an account? <a id="aLoginLink">Login</a></div>'
      + '<div class="err" id="aErr">' + (err || '') + '</div>';
  } else {
    h = '<h2>Morph</h2>'
      + '<input id="aUser" type="text" placeholder="Username" autocomplete="username" />'
      + '<input id="aPass" type="password" placeholder="Password" autocomplete="current-password" />'
      + '<button id="aSubmit">Login</button>'
      + '<div class="link">No account? <a id="aSignupLink">Sign up</a></div>'
      + '<div class="err" id="aErr">' + (err || '') + '</div>';
  }
  authCard.innerHTML = h;
  var userIn = document.getElementById('aUser');
  var passIn = document.getElementById('aPass');
  var subBtn = document.getElementById('aSubmit');
  if (userIn) userIn.focus();

  function submit() {
    var u = (userIn.value || '').trim();
    var p = passIn.value || '';
    if (!u || !p) { setAuthErr('Please enter username and password'); return; }
    if (mode === 'install') doInstall(u, p);
    else if (mode === 'signup') doSignup(u, p);
    else doLogin(u, p);
  }
  subBtn.addEventListener('click', submit);
  passIn.addEventListener('keydown', function(e) { if (e.key === 'Enter') submit(); });
  var loginLink = document.getElementById('aLoginLink');
  if (loginLink) loginLink.addEventListener('click', function() { showAuth('login'); });
  var signupLink = document.getElementById('aSignupLink');
  if (signupLink) signupLink.addEventListener('click', function() { showAuth('signup'); });
}

function setAuthErr(msg) {
  var el = document.getElementById('aErr');
  if (el) el.textContent = msg || '';
}

function showChat() {
  authDiv.style.display = 'none';
  appDiv.style.display = 'flex';
  document.getElementById('userLabel').textContent = username();
  btn.disabled = true;
  inp.disabled = true;
  loadSessions().then(function() {
    if (sessions.length > 0 && !sid) {
      var firstId = sessions[0].id;
      sel.value = firstId;
      connectSession(firstId);
    }
  });
}

/* ---- auth actions ---- */
async function doInstall(u, p) {
  try {
    var j = await api('/api/install', { method: 'POST', body: JSON.stringify({ username: u, password: p }) });
    var tok = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Authorization': 'Basic ' + btoa(u + ':' + p), 'Content-Type': 'application/json' }
    }).then(function(r) { return r.ok ? r.json() : null; });
    if (tok) { saveToken(tok.token, u); showChat(); }
    else { clearCreds(); setAuthErr('Login after install failed'); }
  } catch (e) {
    setAuthErr(e.status === 409 ? 'User already exists' : e.status === 400 ? 'Invalid username or password (min 8 chars)' : 'Install failed');
  }
}

async function doSignup(u, p) {
  var codeIn = document.getElementById('aCode');
  var code = codeIn ? codeIn.value.trim() : '';
  var body = { username: u, password: p };
  if (code) body.signup_code = code;
  try {
    await api('/api/signup', { method: 'POST', body: JSON.stringify(body) });
    var tok = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Authorization': 'Basic ' + btoa(u + ':' + p), 'Content-Type': 'application/json' }
    }).then(function(r) { return r.ok ? r.json() : null; });
    if (tok) { saveToken(tok.token, u); showChat(); }
    else { clearCreds(); setAuthErr('Login after signup failed'); }
  } catch (e) {
    if (e.status === 403) setAuthErr('Signup not available or invalid invite code');
    else if (e.status === 409) setAuthErr('Username already taken');
    else if (e.status === 400) setAuthErr('Invalid username or password (min 8 chars)');
    else setAuthErr('Signup failed');
  }
}

async function doLogin(u, p) {
  try {
    var r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Authorization': 'Basic ' + btoa(u + ':' + p), 'Content-Type': 'application/json' }
    });
    if (!r.ok) { setAuthErr('Wrong username or password'); return; }
    var j = await r.json();
    saveToken(j.token, u);
    showChat();
  } catch (e) {
    clearCreds();
    setAuthErr('Login failed');
  }
}

function doLogout() {
  fetch('/api/logout', { method: 'POST', headers: authHdr() }).catch(function(){});
  clearCreds();
  sid = null;
  showAuth('login');
}

/* ---- bootstrap ---- */
async function bootstrap() {
  var t = token();
  if (t) {
    try {
      await api('/api/sessions');
      showChat();
      return;
    } catch (e) {
      if (e.status === 401) clearCreds();
    }
  }
  try {
    var h = await api('/api/health');
    if (h.setup_required) { showAuth('install'); return; }
  } catch (e) {}
  showAuth('login');
}

/* ---- utils ---- */
function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function nearBottom() { return chat.scrollHeight - chat.scrollTop - chat.clientHeight < 100; }
function scrollDown() { if (nearBottom()) chat.scrollTop = chat.scrollHeight; }

function status(state) {
  st.className = '';
  if (state === 'on') { st.className = 'on'; st.innerHTML = '<span class="dot"></span>connected'; }
  else if (state === 'busy') { st.innerHTML = '<span class="dot" style="background:#e08e3c;animation:pulse 1.2s infinite"></span>processing'; }
  else if (state === 'off') { st.innerHTML = '<span class="dot"></span>'; }
}

function addMsg(cls, html) {
  var el = document.createElement('div');
  el.className = cls;
  el.innerHTML = html;
  chat.appendChild(el);
  scrollDown();
  return el;
}

/* ---- thought ---- */
function getThought() {
  if (thoughtEl && thoughtEl.parentNode) return thoughtEl;
  var el = addMsg('msg-thought', '<div class="label"><span class="indicator"></span>Thinking</div><div class="bd"></div><button class="toggle">show more</button>');
  thoughtEl = el;
  el.querySelector('.toggle').addEventListener('click', function() {
    el.classList.toggle('expanded');
    this.textContent = el.classList.contains('expanded') ? 'show less' : 'show more';
  });
  return el;
}
function appendThought(text) {
  var el = getThought();
  var bd = el.querySelector('.bd');
  bd.textContent += text;
  requestAnimationFrame(function() {
    if (bd.scrollHeight > bd.clientHeight + 2) el.classList.add('truncated');
    var toggle = el.querySelector('.toggle');
    if (el.classList.contains('truncated')) toggle.classList.add('show');
    else toggle.classList.remove('show');
  });
  scrollDown();
}
function closeThought() { thoughtEl = null; }

/* ---- tool call ---- */
function addTool(name, args) {
  closeThought();
  var argsStr = typeof args === 'object' ? JSON.stringify(args) : String(args);
  var preview = argsStr.length > 60 ? argsStr.slice(0, 60) + '\u2026' : argsStr;
  var el = addMsg('msg-tool', '<div class="hd"><span class="arrow">\u25b8</span><span class="name">' + esc(name) + '</span><span class="args-preview">' + esc(preview) + '</span></div><div class="bd"><pre class="args">' + esc(argsStr) + '</pre></div>');
  el.querySelector('.hd').addEventListener('click', function() { el.classList.toggle('expanded'); });
  return el;
}
function appendResult(name, result) {
  var els = chat.querySelectorAll('.msg-tool');
  for (var i = els.length - 1; i >= 0; i--) {
    var n = els[i].querySelector('.name');
    if (n && n.textContent === name) {
      var bd = els[i].querySelector('.bd');
      if (bd) {
        var rl = bd.querySelector('.result-label');
        if (!rl) { rl = document.createElement('div'); rl.className = 'result-label'; rl.textContent = 'Result:'; bd.appendChild(rl); }
        var pre = document.createElement('pre'); pre.className = 'result';
        var txt = typeof result === 'object' ? JSON.stringify(result, null, 2) : String(result);
        pre.textContent = txt;
        bd.appendChild(pre);
      }
      break;
    }
  }
  scrollDown();
}

/* ---- artifact ---- */
function loadBlob(url, cb) {
  fetch(url, { headers: authHdr() })
    .then(function(r) { return r.ok ? r.blob() : Promise.reject(r.status); })
    .then(function(b) { cb(URL.createObjectURL(b)); })
    .catch(function() {});
}

function addArtifact(p) {
  var el;
  if (p.kind === 'image') {
    el = addMsg('msg-artifact', '<div class="label">Image</div><img data-src="' + esc(p.url) + '" alt="' + esc(p.filename) + '" loading="lazy" />');
    var img = el.querySelector('img');
    loadBlob(p.url, function(u) { img.src = u; });
  } else if (p.kind === 'video') {
    el = addMsg('msg-artifact', '<div class="label">Video</div><video data-src="' + esc(p.url) + '" controls preload="metadata"></video>');
    var vid = el.querySelector('video');
    loadBlob(p.url, function(u) { vid.src = u; });
  } else {
    el = addMsg('msg-artifact', '<div class="label">File</div><a data-href="' + esc(p.url) + '" download="' + esc(p.filename) + '">' + esc(p.filename) + '</a>');
    var a = el.querySelector('a');
    a.addEventListener('click', function(e) {
      e.preventDefault();
      loadBlob(p.url, function(u) { a.href = u; a.click(); });
    });
  }
}

function loadEmbeddedArtifacts(root) {
  var nodes = root.querySelectorAll('img[data-src],video[data-src]');
  for (var i = 0; i < nodes.length; i++) {
    (function(n) {
      var url = n.getAttribute('data-src');
      if (!url) return;
      loadBlob(url, function(u) { n.src = u; });
    })(nodes[i]);
  }
}

/* ---- session mgmt ---- */
function populateSel(selId) {
  while (sel.options.length > 0) sel.remove(0);
  if (sessions.length === 0) {
    var o = document.createElement('option'); o.value = ''; o.textContent = '\u2014 No sessions \u2014'; sel.appendChild(o);
  } else {
    for (var i = 0; i < sessions.length; i++) {
      var o = document.createElement('option'); o.value = sessions[i].id; o.textContent = sessions[i].name || sessions[i].id; sel.appendChild(o);
    }
    if (selId) sel.value = selId;
  }
}
async function loadSessions(selectId) {
  try { var j = await api('/api/sessions'); sessions = j.items || []; populateSel(selectId || sid); }
  catch (e) { sessions = []; populateSel(); }
}
async function newSession() {
  try {
    var j = await api('/api/sessions', { method: 'POST', body: JSON.stringify({ name: 'Chat ' + new Date().toLocaleString(), model: 'default' }) });
    sid = j.id;
    await loadSessions(sid);
    connectSession(sid);
    inp.focus();
  } catch (e) { addMsg('msg-error', '<div>Create failed: ' + esc(e.message) + '</div>'); }
}
async function deleteSession() {
  var id = sel.value;
  if (!id) return;
  if (!confirm('Delete this session?')) return;
  try {
    await api('/api/sessions/' + id, { method: 'DELETE' });
    if (id === sid) { disconnect(); chat.innerHTML = ''; sid = null; }
    await loadSessions(sid);
  } catch (e) { addMsg('msg-error', '<div>Delete failed: ' + esc(e.message) + '</div>'); }
}

/* ---- SSE via fetch ---- */
function parseSSEBlock(block) {
  var id = null, eventType = null, lines = [];
  var parts = block.split('\n');
  for (var i = 0; i < parts.length; i++) {
    var line = parts[i];
    if (line.indexOf('id:') === 0) id = line.slice(3).trim();
    else if (line.indexOf('event:') === 0) eventType = line.slice(6).trim();
    else if (line.indexOf('data:') === 0) lines.push(line.slice(5));
    else if (line.indexOf(':') === 0) {} /* comment */
  }
  if (lines.length === 0 && !eventType) return null;
  return { id: id, event: eventType || 'message', data: lines.join('\n') };
}

var sseReconnectDelay = 0;
var SSE_BACKOFF = [1000, 2000, 4000, 8000, 16000, 30000];
var sseBackoffIdx = 0;

function connectSession(id) {
  disconnect();
  chat.innerHTML = '';
  sid = id;
  btn.disabled = false;
  inp.disabled = false;
  status('on');
  sseBackoffIdx = 0;
  startSSE(id);
}

function startSSE(id) {
  var t = token();
  if (!t) return;
  var headers = Object.assign({ 'Accept': 'text/event-stream' }, authHdr());
  var lastEventId = null;

  sseCtrl = { aborted: false };

  fetch('/api/sessions/' + id + '/events', { headers: headers })
    .then(function(resp) {
      if (resp.status === 401) { doLogout(); return; }
      if (!resp.ok) throw new Error('SSE HTTP ' + resp.status);
      status('on');
      sseBackoffIdx = 0;
      var reader = resp.body.getReader();
      var dec = new TextDecoder();
      var buf = '';

      function read() {
        if (sseCtrl && sseCtrl.aborted) return;
        return reader.read().then(function(result) {
          if (result.done) { scheduleReconnect(id); return; }
          buf += dec.decode(result.value, { stream: true });
          var pos;
          while ((pos = buf.indexOf('\n\n')) >= 0) {
            var block = buf.slice(0, pos);
            buf = buf.slice(pos + 2);
            var ev = parseSSEBlock(block);
            if (ev) {
              if (ev.id) lastEventId = ev.id;
              dispatchSSE(ev.event, ev.data);
            }
          }
          read();
        }).catch(function(e) {
          if (sseCtrl && !sseCtrl.aborted) scheduleReconnect(id);
        });
      }
      read();
    })
    .catch(function(e) {
      if (sseCtrl && !sseCtrl.aborted) scheduleReconnect(id);
    });
}

function scheduleReconnect(id) {
  if (sseCtrl && sseCtrl.aborted) return;
  if (sid !== id) return;
  var delay = SSE_BACKOFF[Math.min(sseBackoffIdx, SSE_BACKOFF.length - 1)];
  sseBackoffIdx++;
  status('off');
  setTimeout(function() {
    if (sseCtrl && sseCtrl.aborted) return;
    if (sid !== id) return;
    startSSE(id);
  }, delay);
}

function dispatchSSE(eventType, data) {
  var p;
  try { p = JSON.parse(data); } catch (e) { p = { text: data }; }

  switch (eventType) {
  case 'ready':
    status('on');
    break;
  case 'turn_start':
    if (turnCount > 0) addMsg('turn-hr', '<hr class="turn-hr" />');
    turnCount++;
    closeThought();
    isBusy = true;
    btn.disabled = true;
    status('busy');
    break;
  case 'thought':
    if (p.text) appendThought(p.text);
    break;
  case 'tool_call':
    addTool(p.tool || '?', p.args || {});
    break;
  case 'tool_result':
    appendResult(p.tool || '?', p.result);
    break;
  case 'reflection':
    closeThought();
    addMsg('msg-reflection', '<div class="label">\u26a0 Guardrail</div><div>' + esc(p.text || '') + '</div>');
    break;
  case 'final':
    closeThought();
    var txt = p.text || '';
    var id_ = 'm' + Date.now() + Math.random().toString(36).slice(2, 6);
    var el = addMsg('msg-assistant', '<div class="c" id="' + id_ + '"></div><button class="copy" data-target="' + id_ + '">copy</button>');
    var c = el.querySelector('.c');
    try {
      var html = markedOk ? marked.parse(txt, { breaks: true, gfm: true }) : esc(txt).replace(/\n/g, '<br>');
      c.innerHTML = purifyOk ? DOMPurify.sanitize(html) : html;
      loadEmbeddedArtifacts(c);
    } catch (e) { c.textContent = txt; }
    el.querySelector('.copy').addEventListener('click', function() {
      var t = el.querySelector('.c');
      var r = document.createRange(); r.selectNode(t);
      var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
      try { document.execCommand('copy'); } catch (e) {}
      s.removeAllRanges();
      this.textContent = 'copied';
      var self = this;
      setTimeout(function() { self.textContent = 'copy'; }, 2000);
    });
    break;
  case 'turn_end':
    closeThought();
    isBusy = false;
    btn.disabled = false;
    status('on');
    break;
  case 'artifact_ready':
    addArtifact(p);
    break;
  case 'error':
    closeThought();
    addMsg('msg-error', '<div>' + esc(p.message || 'Unknown error') + '</div>');
    break;
  }
}

function disconnect() {
  if (sseCtrl) { sseCtrl.aborted = true; sseCtrl = null; }
  thoughtEl = null;
  turnCount = 0;
  isBusy = false;
  btn.disabled = true;
  inp.disabled = true;
  status('off');
}

/* ---- send ---- */
async function sendPrompt() {
  if (!sid || isBusy) return;
  var text = inp.value.trim();
  if (!text) return;
  inp.value = '';
  inp.style.height = 'auto';
  isBusy = true;
  btn.disabled = true;
  closeThought();
  addMsg('msg-user', '<div class="b">' + esc(text) + '</div>');
  try {
    await api('/api/sessions/' + sid + '/turns', { method: 'POST', body: JSON.stringify({ prompt: text }) });
  } catch (e) {
    var msg = e.message;
    if (e.status === 401) msg = 'Session expired, please re-login';
    else if (e.status === 429) msg = 'Too many requests, please wait';
    else if (e.status === 403) msg = 'No permission';
    addMsg('msg-error', '<div>Send failed: ' + esc(msg) + '</div>');
    isBusy = false;
    btn.disabled = false;
  }
}

/* ---- events ---- */
document.getElementById('newSess').addEventListener('click', newSession);
document.getElementById('logoutBtn').addEventListener('click', doLogout);
document.getElementById('delSess').addEventListener('click', deleteSession);

sel.addEventListener('change', function() {
  var id = this.value;
  if (!id || id === sid) return;
  connectSession(id);
});

inp.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); sendPrompt(); }
});

btn.addEventListener('click', sendPrompt);

inp.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 200) + 'px';
});

bootstrap();
</script>
