name = "locate"
version = "1.0.0"
description = "Get current geographic coordinates using platform-native location services. Returns latitude and longitude adjusted for the current region: GCJ-02 inside mainland China and WGS-84 elsewhere."
author = "morph"
type = "exec"
entry = "locate"
fronts = ["cli"]
categories = ["system"]
permissions = 5
max_memory_mb = 64
max_cpu_seconds = 30
input_schema = "{\"type\":\"object\",\"properties\":{}}"
output_schema = "{\"type\":\"object\",\"properties\":{\"latitude\":{\"type\":\"number\"},\"longitude\":{\"type\":\"number\"},\"region\":{\"type\":\"string\"},\"accuracy_m\":{\"type\":\"number\"},\"altitude\":{\"type\":\"number\"},\"timestamp\":{\"type\":\"string\"}}}"

[build]
command = "make"
